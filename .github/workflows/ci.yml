name: DeepSec CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: python -m pytest tests/deepsec
      - run: python -m build

  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked --manifest-path tui/Cargo.toml
      - run: cargo test --locked --manifest-path tui/Cargo.toml
      - run: cargo test --locked --manifest-path rust-lsp/Cargo.toml

  jetbrains-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - run: chmod +x ./gradlew
        working-directory: jetbrains
      - run: ./gradlew buildPlugin --no-daemon
        working-directory: jetbrains

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: docker build --tag deepsec:ci .
      - name: Verify Shield image
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD/tests/fixtures:/workspace:ro" deepsec:ci shield scan /workspace --layer l1 --format json --output -
          status=$?
          test "$status" -eq 0 -o "$status" -eq 2
