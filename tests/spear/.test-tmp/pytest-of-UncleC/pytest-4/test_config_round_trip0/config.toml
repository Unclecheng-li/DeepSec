[llm]
provider = "deepseek"
api_key = ""
base_url = "https://api.deepseek.com/v1"
fallbacks = ["claude", "openai", "local"]

[llm.providers]
[llm.providers.deepseek]
api_key = ""
base_url = ""

[llm.providers.claude]
api_key = ""
base_url = ""

[llm.providers.openai]
api_key = ""
base_url = ""

[llm.providers.local]
api_key = ""
base_url = ""

[llm.shield]
chat_model = "deepseek-chat"
reason_model = "deepseek-reasoner"

[llm.spear]
reason_model = "deepseek-reasoner"
explore_model = "deepseek-chat"

[shield]
l1 = true
l2 = true
l3 = true
package_verification = "seed"
dedup = true

[spear]
scan_mode = "standard"
fail_on = "verified"
scope = "full"
max_parallel = 3
max_rounds = 20

[report]
format = ["markdown", "sarif"]
output_dir = "~/.deepsec/reports"
attack_chain = true

[storage]
findings_db = "~/.deepsec/findings.db"
runs_dir = "~/.deepsec/runs"
snapshots_dir = "~/.deepsec/snapshots"

[tui]
theme = "dark"
thinking_display = true
model_auto = true
sidebar_width = 30
output_width = 45

[role]
default = "auditor"
